server.port=3001
jwt.secret=${JWT_SECRET:change-this-secret}
jwt.expiration=86400000
spring.jackson.default-property-inclusion=non_null

# Database settings
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
# Fallback to local SQLite when POSTGRES URL is not provided
db.path=${DB_PATH:./data/data.db}
spring.datasource.initialization-mode=never

# AWS / LocalStack settings
aws.endpoint=${AWS_ENDPOINT:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET:service-virtualization-other}
aws.sqs.enabled=${AWS_SQS_ENABLED:false}
aws.sqs.queue-name=${AWS_SQS_QUEUE:service-virtualization-schedule}
aws.sqs.schedule-cron=${AWS_SQS_SCHEDULE_CRON:0 0/5 * * * ?}
aws.sqs.polling-delay-ms=${AWS_SQS_POLLING_DELAY_MS:15000}
aws.storage.enabled=${AWS_STORAGE_ENABLED:false}
